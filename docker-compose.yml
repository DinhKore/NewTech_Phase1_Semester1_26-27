services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: course-assistant-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_PATH=/app/data/app.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CHAT_MODEL=gemini-2.5-flash
      - GEMINI_EMBEDDING_MODEL=text-embedding-004
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production-min-32-chars}
      - CORS_ORIGIN=http://localhost:80,http://localhost:5173,http://localhost:3000
      - LOG_LEVEL=info
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@example.com}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: course-assistant-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
